# Ubuntu sshd_config.d drop-in. Apply manually after testing a key-based login.
# The first value wins for most sshd options: inspect effective settings with sshd -T.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
